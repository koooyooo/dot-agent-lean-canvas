meta:
  project_name: "YouTube"
  author: "Case Study Sample (Retrospective analysis from public data. Not an official document)"
  iteration: "v1.0"
  last_updated: "2026-10-30"
  lang: "en"
  canvas_type: "PostHoc"
  status_canvas: "-"
  status_decision: "-"

canvas:

  # 1. Problem
  problem:
    top_3_problems:
      - "People want to watch videos on demand, but are constrained by broadcast schedules or physical rentals"
      - "Creators want to publish their videos, but video hosting, encoding, and sharing are prohibitively heavy"
      - "Advertisers want targeted exposure near engaged audiences without TV-level costs"
    existing_alternatives:
      - "Broadcast TV, DVD rentals (Blockbuster, Netflix mail-order)"
      - "Self-hosted servers, peer-to-peer file sharing, Google Video, Vimeo"
      - "TV commercials, display banners, search ads"

  # 2. Solution
  solution:
    top_3_features:
      - "Instant in-browser streaming for any searched video"
      - "Frictionless video upload and public hosting with a free account"
      - "Contextual video ad placements with creator revenue sharing"

  # 3. Customer Segments
  customer_segments:
    target_customers:
      - "Viewers seeking on-demand video entertainment and knowledge (Users)"
      - "Video creators and media looking for an audience and distribution (Supply)"
      - "Advertisers looking to buy audience attention (Paying Customers)"
    early_adopters:
      - "Internet-savvy individuals wanting to share short video clips more easily than via email or message boards"

  # 4. Unique Value Proposition
  unique_value_proposition:
    headline: "Find and watch any video you want, instantly"
    high_level_concept: "Flickr for video (Anyone can upload, anyone can watch)"

  # 5. Key Metrics
  key_metrics:
    acquisition: "New viewers (including logged-out), new creator signups"
    activation: "First video playback completion or first video upload"
    retention: "Watch time, repeat visits, sustained creator upload cadence"

  # 6. Channels
  channels:
    inbound_and_outbound:
      - "Embeds on blogs/websites, URL sharing, search, related video recommendations"
      - "Google search integration and ecosystem properties; word-of-mouth"

  # 7. Unfair Advantage
  unfair_advantage:
    defensibility: "Network effect of an indexed video catalog pairing viewers and creators; distribution via Google; vast viewer watch-time data and creator fanbase moats"

  # 8. Cost Structure
  cost_structure:
    fixed_costs:
      - "Product development, infrastructure, content moderation, general & administrative"
    variable_costs:
      - "CDN streaming bandwidth, storage, ad-serving infrastructure, creator revenue payouts"

  # 9. Revenue Streams
  revenue_streams:
    monetization_model: "Video advertising (selling viewer attention to advertisers; later Premium subscription)"
    pricing: "Ad pricing based on CPM / CPV varies widely by campaign. No flat public price"
    lifetime_value_estimate: "Undecided. No public LTV figure. Derived backwards from advertiser spend and creator inventory"

# Retrospective reconstruction: how each risk was actually retired, from public data (no rank)
review_risks:
  customer:
    status: "Supported"
    comment: "After the 2005 launch, embeds on MySpace and blogs pulled in viewers and creators organically. By July 2006: 100M views and 65K uploads per day (press reports)"
  market:
    status: "Supported"
    comment: "Unproven at acquisition (2006), weighed down by bandwidth costs and copyright suits (Viacom, 2007). Ads matured under Google; first disclosed ad revenue was $15.1B for 2019"
  product:
    status: "Supported"
    comment: "Alternatives (self-hosting, file sharing) were heavy; instant in-browser playback and open uploads were adopted. Growth in views and uploads showed retention"

review_stages:
  problem_solution_fit:
    status: "Cleared"
    comment: "Between the May 2005 public beta and the December launch, people sharing short clips adopted it through embeds"
  product_market_fit:
    status: "Cleared"
    comment: "Product pull was clear by 2006, but market (revenue) evidence lagged until ads were established after the Google acquisition"
  scale:
    status: "Cleared"
    comment: "Google acquired it for $1.65B in October 2006. The 2007 Partner Program (creator revenue share) and Content ID scaled supply and rights handling"

review_fragile_hypothesis:
  risk: "market"
  hypothesis: "(At the time) Can ads cover surging bandwidth costs and copyright risk?"
  experiment: "(What actually happened) Video ads and the Partner Program after the acquisition, plus Content ID to give rights holders a monetization option. The most fragile risk was market, not customer or product"

review_personal:
  - "This is a post-hoc retrospective of an existing service, reconstructing boxes from actual outcomes rather than initial hypothesis validation. status_canvas and status_decision are set to '-'. Do not equate historical success with an automatic 'Go' today."
  - "Pricing and LTV figures are public estimates or undecided. Do not use as official business disclosures."
  - "Viewers are users, creators are supply, and advertisers are paying customers (multi-sided platform). Omitting viewers erases distribution; omitting advertisers eliminates revenue; omitting creators turns the platform into a pure ad network."
  - "Later developments (Shorts, Premium, YouTube TV) are excluded to focus on the core bet: UGC video streaming plus advertising."

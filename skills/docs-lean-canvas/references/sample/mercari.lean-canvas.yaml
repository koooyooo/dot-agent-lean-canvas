meta:
  project_name: "メルカリ"
  author: "教材サンプル（公開情報からの後追い。公式資料ではない）"
  iteration: "v1.0"
  last_updated: "2026-09-08"
  canvas_type: "PostHoc"
  status_canvas: "-"
  status_decision: "-"

canvas:

  # 1. 課題（Problem）[左端・上下]
  problem:
    top_3_problems:
      - "不用品を、知り合い以外に手間なく売りたいが、出品が重い"
      - "中古をお得に買いたいが、店舗は高く、入札型は面倒"
      - "個人間の送金・未着・偽物が怖く、取引を始められない"
    existing_alternatives:
      - "Yahoo!オークション"
      - "リサイクルショップ / 質屋"
      - "ジモティー、知人に譲る、捨てる"

  # 2. ソリューション（Solution）[中左・上]
  solution:
    top_3_features:
      - "スマホで写真を撮ってすぐ出品できる"
      - "アプリ内決済と匿名配送で、会わずに売買できる"
      - "評価・売上金・運営介入で、見知らぬ相手とも取引できる"

  # 3. 顧客セグメント（Customer Segments）[右端・上下]
  customer_segments:
    target_customers:
      - "不用品を処分したい個人（売り手）"
      - "中古をお得に買いたい個人（買い手）"
    early_adopters:
      - "スマホネイティブの若年層。ファッションや雑貨を頻繁に入れ替える人"

  # 4. 独自の価値提案（Unique Value Proposition - UVP）[中央・上下]
  unique_value_proposition:
    headline: "スマホで、今すぐ売れて、今すぐ買える"
    high_level_concept: "個人間売買のコンビニ（出品も購入もアプリで完結するフリーマーケット）"

  # 5. 主要指標（Key Metrics）[中左・下]
  key_metrics:
    acquisition: "新規ダウンロード / 新規登録"
    activation: "初出品、または初購入（どちらか一方で価値を実感）"
    retention: "MAU、リピート出品率、リピート購入率"

  # 6. チャネル（Channels）[中右・下]
  channels:
    inbound_and_outbound:
      - "アプリストア、口コミ、招待"
      - "SNS、TVCM、交通広告"

  # 7. 圧倒的な優位性（Unfair Advantage）[中右・上]
  unfair_advantage:
    defensibility: "出品と購入が揃った流動性（二面市場のネットワーク効果）。ブランド、配送提携、蓄積した評価・取引データ"

  # 8. コスト構造（Cost Structure）[底左]
  cost_structure:
    fixed_costs:
      - "プロダクト開発、インフラ、カスタマーサポート、本社人件費"
    variable_costs:
      - "決済手数料、配送関連、広告獲得単価、不正・補償コスト"

  # 9. 収益の流れ（Revenue Streams）[底右]
  revenue_streams:
    monetization_model: "出品者からの販売手数料（後年は決済・金融も）"
    pricing: "販売代金の約10%（初期の公開料率に基づく近似。現行はプランにより異なる）"
    lifetime_value_estimate: "未決。公開LTVはない。手数料×生涯取引回数から逆算する仮説段階"

review_personal:
  - "既存サービスの後追いである。初期の仮説検証ではなく、結果からマスを埋めている。status_canvas / status_decision は -。当時の成功を今の Go にしない"
  - "数値（手数料、LTV）は公開情報の近似または未決。公式の事業資料として使わない"
  - "二面市場なので顧客は売り手と買い手の両方。片方だけ書くとUVPが崩れる"
  - "後年のメルペイ等は当初の約束ではない。このキャンバスはC2Cフリマとしての核に限定している"

review_investor:
  - "教材の後追いであり、この欄の主にしない。後年の規模や時価を当時の投資判断にしない"

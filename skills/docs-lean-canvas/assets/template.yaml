meta:
  project_name: "[Product / Service Name]"
  author: "[Author Name]"
  iteration: "v1.0"
  last_updated: "YYYY-MM-DD"
  # Language: ja | en (Default is ja if omitted; en uses English template and labels)
  lang: "ja"
  # New: Map for deciding whether to pursue now. PostHoc: Retrospective case study / deconstruction
  canvas_type: "New | PostHoc"
  # Map completeness: Draft | Building | Done | -
  status_canvas: "Draft | Building | Done | -"
  # Personal pursuit decision: Undecided | Go | NoGo | Parked | -
  status_decision: "Undecided | Go | NoGo | Parked | -"

canvas:

  # 1. Problem [Left column, top & bottom]
  problem:
    top_3_problems:
      - "Top priority problem 1"
      - "Problem 2"
      - "Problem 3"
    existing_alternatives:
      - "Current alternatives (competitors, spreadsheets, manual work, etc.)"

  # 2. Solution [Middle-left, top]
  solution:
    top_3_features:
      - "Core feature / mechanism solving Problem 1"
      - "Feature solving Problem 2"
      - "Feature solving Problem 3"

  # 3. Customer Segments [Right column, top & bottom]
  customer_segments:
    target_customers:
      - "Target primary customer groups / attributes"
    early_adopters:
      - "Ideal early adopter profile who feels the pain most acutely"

  # 4. Unique Value Proposition (UVP) [Center, top & bottom]
  unique_value_proposition:
    headline: "Compelling message stating why this product is worth choosing"
    high_level_concept: "High-level analogy (e.g. 'Uber for X', 'Offline-first Notion')"

  # 5. Key Metrics [Middle-left, bottom]
  key_metrics:
    acquisition: "Initial acquisition / signup metric"
    activation: "Action indicating the user reached value (Aha Moment)"
    retention: "Retention rate (day/week/month retention)"

  # 6. Channels [Middle-right, bottom]
  channels:
    inbound_and_outbound:
      - "Pathways to reach users (SNS, blog, GitHub, community, SEO, word-of-mouth)"

  # 7. Unfair Advantage [Middle-right, top]
  unfair_advantage:
    defensibility: "Moats not easily copied or bought (domain expertise, unique algorithms, community, first-mover advantage)"

  # 8. Cost Structure [Bottom-left]
  cost_structure:
    fixed_costs:
      - "Fixed costs (servers, domains, SaaS subscriptions, etc.)"
    variable_costs:
      - "Variable costs (LLM API usage, payment fees, bandwidth traffic, etc.)"

  # 9. Revenue Streams [Bottom-right]
  revenue_streams:
    monetization_model: "Monetization model (subscription, one-time, freemium, API usage, ads, etc.)"
    pricing: "Target pricing (e.g., $10/mo / $100/yr)"
    lifetime_value_estimate: "Estimated LTV (or expected revenue per user)"

# Problem review (New). Real competitors (domestic / overseas) with pricing, and raw user complaints about existing alternatives
review_problem:
  - "Competitor: [Service] ([Region]) - [Price] - [Gap vs. this canvas]"
  - "Complaint: \"[Quoted or paraphrased user voice]\" ([Source: review site / SNS / forum])"

# Overall personal review. See SKILL.md for common pitfalls. Do not create a checklist
review_personal:
  - "Comment 1"

# Most fragile hypothesis (New). Exactly one hypothesis and one validation action doable in hours to 1 week
review_fragile_hypothesis:
  hypothesis: "The single assumption whose failure breaks this canvas"
  experiment: "One concrete action (article/video to publish, who to ask what, which mock to show) with the signal to observe"

# Investor view. Read references/review-investor.md before writing
review_investor:
  - "Comment 1"